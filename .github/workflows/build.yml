name: Build LINETweak for LiveContainer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Theos SDK archive contains symlinks that macOS 26's unzip refuses to
      # create in the hosted runner. Git checkout preserves their link metadata.
      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: .theos
          submodules: recursive
          persist-credentials: false

      - name: Checkout Theos SDKs
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          ref: master
          path: .theos-sdk-source
          persist-credentials: false

      - name: Install Theos SDKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.theos/sdks"
          find "$GITHUB_WORKSPACE/.theos-sdk-source" -mindepth 1 -maxdepth 1 -type d -name "*.sdk" \
            -exec cp -R {} "$GITHUB_WORKSPACE/.theos/sdks/" \;
          test -n "$(find "$GITHUB_WORKSPACE/.theos/sdks" -mindepth 1 -maxdepth 1 -type d -name "*.sdk" -print -quit)"

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/.theos

      - name: Build Tweak
        run: |
          export THEOS_PACKAGE_SCHEME=rootless
          make package FINALPACKAGE=1
        
      - name: Patch for LiveContainer (Fix rpath)
        run: |
          # 全てのビルド済みdylib（各アーキおよび結合済み）に対してパス修正を行う
          find .theos/obj -name "*.dylib" | while read -r dylib; do
            echo "Patching: $dylib"
            install_name_tool -change /usr/lib/libsubstrate.dylib @rpath/libsubstrate.dylib "$dylib" || true
            install_name_tool -change /Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate @rpath/CydiaSubstrate.framework/CydiaSubstrate "$dylib" || true
            otool -L "$dylib"
          done

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: LINETweak-LiveContainer
          path: .theos/obj/**/*.dylib
